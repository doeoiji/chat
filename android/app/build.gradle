plugins {
    id 'com.android.application'
}

def keystoreFile = file(System.getenv("TELECHAT_KEYSTORE_PATH") ?: "${System.getProperty('user.home')}/.android/telechat-release.jks")
def keystorePass = System.getenv("TELECHAT_KEYSTORE_PASS") ?: "telechat_release_key"
def releaseKeyAlias = System.getenv("TELECHAT_KEY_ALIAS") ?: "telechat"
def releaseKeyPass = System.getenv("TELECHAT_KEY_PASS") ?: "telechat_release_key"

android {
    namespace 'fun.bitdev.telechat'
    compileSdk 35

    defaultConfig {
        applicationId "fun.bitdev.telechat"
        minSdk 24
        targetSdk 35
        versionCode 15
        versionName "1.0.14-beta.1"
    }

    flavorDimensions "compat", "channel"
    productFlavors {
        standard {
            dimension "compat"
            applicationId "fun.bitdev.telechat"
            minSdk 24
            targetSdk 35
        }
        legacy {
            dimension "compat"
            applicationId "fun.bitdev.telechat.legacy"
            minSdk 21
            targetSdk 29
        }
        stable {
            dimension "channel"
        }
        beta {
            dimension "channel"
            applicationIdSuffix ".beta"
        }
    }

    applicationVariants.configureEach { variant ->
        def flavorNames = variant.productFlavors.collect { it.name }
        boolean isLegacy = flavorNames.contains("legacy")
        boolean isBeta = flavorNames.contains("beta")

        String appName = isBeta ? (isLegacy ? "VibeRoom Beta Legacy" : "VibeRoom Beta") : (isLegacy ? "VibeRoom Legacy" : "VibeRoom")
        String assetPrefix = isBeta ? (isLegacy ? "VibeRoomBetaCompat-v" : "VibeRoomBeta-v") : (isLegacy ? "VibeRoomCompat-v" : "VibeRoom-v")
        String appUrl = isBeta ? "https://betachat.bitdev.fun" : "https://chat.bitdev.fun"
        String releaseChannel = isBeta ? "beta" : "stable"

        variant.resValue "string", "app_name", appName
        variant.resValue "string", "apk_asset_prefix", assetPrefix
        variant.resValue "string", "app_url", appUrl
        variant.resValue "string", "release_channel", releaseChannel
    }

    signingConfigs {
        release {
            if (keystoreFile.exists()) {
                storeFile keystoreFile
                storePassword keystorePass
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPass
            }
            v1SigningEnabled true
            v2SigningEnabled true
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            if (keystoreFile.exists()) {
                signingConfig signingConfigs.release
            }
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'com.google.firebase:firebase-messaging:23.4.1'
}

if (file("google-services.json").exists()) {
    apply plugin: 'com.google.gms.google-services'
}
