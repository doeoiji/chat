name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master, beta ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install SDKs
        run: |
          SDKMANAGER=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-29" "build-tools;35.0.0"

      - name: Cache Android Release Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/telechat-release.jks
          key: telechat-release-keystore-v1

      - name: Ensure Release Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/telechat-release.jks ]; then
            keytool -genkeypair -v -keystore ~/.android/telechat-release.jks -storepass telechat_release_key -alias telechat -keypass telechat_release_key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TeleChat,O=BitDev,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Decode Optional Firebase google-services.json
        env:
          GOOGLE_SERVICES_JSON_B64: ${{ secrets.GOOGLE_SERVICES_JSON_B64 }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON_B64" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON_B64" | tr -d '\r\n ' | base64 -d > android/app/google-services.json
            echo "Loaded google-services.json for FCM push."
          else
            echo "No GOOGLE_SERVICES_JSON_B64 secret set; building with SSE/JobService notification fallback."
          fi

      - name: Configure Release Channel & Gradle Tasks
        run: |
          VER=$(grep -E 'versionName\s+"' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          if [ -z "$VER" ]; then
            echo "Error: Could not read versionName from android/app/build.gradle."
            exit 1
          fi

          if [ "${{ github.ref_name }}" = "beta" ]; then
            CHANNEL="beta"
            TASKS="assembleStandardBetaRelease"
            if [ ! -f android/app/google-services.json ] || grep -q '"fun\.bitdev\.telechat\.legacy\.beta"' android/app/google-services.json; then
              TASKS="$TASKS assembleLegacyBetaRelease"
            else
              echo "Note: fun.bitdev.telechat.legacy.beta not found in google-services.json; skipping Legacy Beta APK."
            fi
          else
            CHANNEL="stable"
            if [[ "$VER" == *-beta* ]]; then
              echo "Error: Stable branch '${{ github.ref_name }}' cannot release beta versionName '${VER}'. Update versionName (e.g. '1.0.14') before pushing/merging to main."
              exit 1
            fi
            TASKS="assembleStandardStableRelease assembleLegacyStableRelease"
          fi

          {
            echo "RELEASE_CHANNEL=$CHANNEL"
            echo "APP_VERSION=$VER"
            echo "GRADLE_TASKS=$TASKS"
          } >> "$GITHUB_ENV"
          echo "Configured channel=$CHANNEL version=$VER tasks=$TASKS"

      - name: Build Signed Release APKs
        working-directory: android
        run: gradle $GRADLE_TASKS

      - name: Stage APKs & Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          mkdir -p dist-apks
          STD_SRC=$(find android/app/build/outputs/apk -type f -iname '*standard*release.apk' ! -iname '*-unsigned.apk' | head -n 1)
          LEG_SRC=$(find android/app/build/outputs/apk -type f -iname '*legacy*release.apk' ! -iname '*-unsigned.apk' | head -n 1)

          if [ "$RELEASE_CHANNEL" = "beta" ]; then
            TAG="beta-v${APP_VERSION}"
            STD_NAME="VibeRoomBeta-v${APP_VERSION}.apk"
            LEG_NAME="VibeRoomBetaCompat-v${APP_VERSION}.apk"
            REL_TITLE="VibeRoom Beta ${TAG}"
            REL_NOTES="VibeRoom Beta Android ${TAG} (connects to https://betachat.bitdev.fun; installs side-by-side with Stable VibeRoom)"
            REL_FLAGS="--prerelease"
          else
            TAG="v${APP_VERSION}"
            STD_NAME="VibeRoom-${TAG}.apk"
            LEG_NAME="VibeRoomCompat-${TAG}.apk"
            REL_TITLE="VibeRoom ${TAG}"
            REL_NOTES="VibeRoom Android ${TAG} (includes ${STD_NAME} for Android 7+ and ${LEG_NAME} for Android 5.0–10 / older devices)"
            REL_FLAGS="--latest"
          fi

          ASSETS=()
          if [ -n "$STD_SRC" ] && [ -f "$STD_SRC" ]; then
            cp "$STD_SRC" "dist-apks/$STD_NAME"
            ASSETS+=("dist-apks/$STD_NAME")
          fi
          if [ -n "$LEG_SRC" ] && [ -f "$LEG_SRC" ]; then
            cp "$LEG_SRC" "dist-apks/$LEG_NAME"
            ASSETS+=("dist-apks/$LEG_NAME")
          fi
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "Error: No signed release APKs found."
            exit 1
          fi

          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            gh release create "$TAG" "${ASSETS[@]}" --title "$REL_TITLE" --notes "$REL_NOTES" $REL_FLAGS
          fi

      - name: Upload Built APKs Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeRoom-${{ github.ref_name }}-APKs
          path: dist-apks/*.apk
