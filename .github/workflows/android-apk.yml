name: Build Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]
    paths:
      - 'android/**'
      - '.github/workflows/android-apk.yml'

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Accept Android SDK Licenses & Install SDKs
        run: |
          SDKMANAGER=$(ls -d /usr/local/lib/android/sdk/cmdline-tools/*/bin/sdkmanager | tail -n 1)
          yes | "$SDKMANAGER" --licenses > /dev/null || true
          "$SDKMANAGER" "platforms;android-35" "platforms;android-29" "build-tools;35.0.0"

      - name: Cache Android Release Keystore
        uses: actions/cache@v4
        with:
          path: ~/.android/telechat-release.jks
          key: telechat-release-keystore-v1

      - name: Ensure Release Keystore Exists
        run: |
          mkdir -p ~/.android
          if [ ! -f ~/.android/telechat-release.jks ]; then
            keytool -genkeypair -v -keystore ~/.android/telechat-release.jks -storepass telechat_release_key -alias telechat -keypass telechat_release_key -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=TeleChat,O=BitDev,C=US"
          fi

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Build Signed Release APKs (Standard + Legacy)
        working-directory: android
        run: gradle assembleStandardRelease assembleLegacyRelease

      - name: Publish GitHub Release & Upload Both APKs
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VER=$(grep -E 'versionName\s+"' android/app/build.gradle | sed -E 's/.*"([^"]+)".*/\1/')
          TAG="v${VER}"
          STD_APK="android/app/build/outputs/apk/standard/release/VibeRoom-${TAG}.apk"
          LEG_APK="android/app/build/outputs/apk/legacy/release/VibeRoomCompat-${TAG}.apk"
          cp android/app/build/outputs/apk/standard/release/app-standard-release.apk "$STD_APK"
          cp android/app/build/outputs/apk/legacy/release/app-legacy-release.apk "$LEG_APK"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "$STD_APK" "$LEG_APK" --clobber
          else
            gh release create "$TAG" "$STD_APK" "$LEG_APK" --title "VibeRoom ${TAG}" --notes "VibeRoom Android ${TAG} (includes VibeRoom-${TAG}.apk for Android 7+ and VibeRoomCompat-${TAG}.apk for Android 5.0–10 / older devices)" --latest
          fi

      - name: Upload VibeRoom Standard APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeRoom-Standard-APK
          path: android/app/build/outputs/apk/standard/release/app-standard-release.apk

      - name: Upload VibeRoom Legacy APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: VibeRoom-Legacy-APK
          path: android/app/build/outputs/apk/legacy/release/app-legacy-release.apk
